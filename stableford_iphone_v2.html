<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stableford 4Ball</title>
<style>
body{margin:0;background:#f3f6f3;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#18221b}header{background:#075d32;color:white;padding:20px 16px}h1{margin:0;font-size:24px}.wrap{max-width:900px;margin:auto;padding:12px}.card{background:white;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}input,button{font:inherit}input{padding:10px;border:1px solid #ccd7ce;border-radius:9px;width:100%;box-sizing:border-box}.players{display:grid;gap:8px}.pr{display:grid;grid-template-columns:1fr 75px 42px;gap:7px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.green{background:#075d32;color:white}.grey{background:#e8eee9}.score{overflow:auto}.score table{border-collapse:collapse;width:100%;min-width:650px}.score th,.score td{border-bottom:1px solid #dfe6e0;padding:7px;text-align:center}.score th{font-size:12px;color:#68746c}.score td:first-child,.score th:first-child{text-align:left;position:sticky;left:0;background:white}.score input{width:48px;height:42px;padding:0;text-align:center;font-size:19px;font-weight:800}.pt{font-weight:900;color:#075d32}.lead{display:grid;gap:7px}.lr{display:grid;grid-template-columns:30px 1fr 70px 70px;background:#edf6f0;border-radius:10px;padding:10px}.big{font-size:24px;font-weight:900;color:#075d32}.muted{color:#69756d;font-size:12px}@media(max-width:600px){.score table{min-width:600px}.wrap{padding:8px}.card{padding:11px}}
.holeNav{display:flex;justify-content:space-between;align-items:center;background:#edf6f0;border-radius:14px;padding:10px 12px;margin:12px 0}.holeTitle{font-size:25px;font-weight:900;text-align:center}.holeInfo{font-size:13px;color:#69756d;text-align:center}.navBtn{border:0;border-radius:11px;padding:11px 15px;font-weight:800}.mobileCards{display:grid;gap:9px}.playerScore{display:grid;grid-template-columns:1fr 82px 70px;align-items:center;gap:8px;background:#fff;border:1px solid #dfe6e0;border-radius:13px;padding:10px}.playerScore .muted{display:block}.bigScore{width:82px!important;height:54px!important;padding:0!important;text-align:center;font-size:25px!important;border:2px solid #075d32!important}.bigPts{font-size:23px;font-weight:900;color:#075d32;text-align:center}.bigPts span{display:block;font-size:10px;color:#69756d}.navRow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.holeStrip{display:flex;gap:6px;overflow:auto;padding:10px 0 2px}.holeStrip button{min-width:36px;height:36px;border:1px solid #ccd7ce;border-radius:9px;background:#fff;font-weight:800}.holeStrip button.sel{background:#075d32;color:#fff}.holeStrip button.done{box-shadow:inset 0 -3px 0 #78b58f}</style></head><body>
<header><h1>⛳ Stableford 4Ball</h1><div class="muted" style="color:#d8eee1">Live scorecard for up to 4 golfers</div></header>
<div class="wrap">
<div class="card"><b>Golfers</b><div id="players" class="players" style="margin-top:10px"></div><button class="btn green" style="margin-top:10px" id="add">+ Add golfer</button></div>
<div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><label class="muted">Course<input id="course" placeholder="Course name"></label><label class="muted">Date<input id="date" type="date"></label></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Scorecard</b><button class="btn grey" id="clear">Clear scores</button></div><div class="score" id="score"></div></div>
<div class="card"><b>Live leaderboard</b><div id="leader" class="lead" style="margin-top:10px"></div></div>
<div class="card"><button class="btn green" id="save">Save round</button><button class="btn grey" id="new" style="margin-left:6px">New round</button><div id="saved" style="margin-top:12px"></div></div>
</div>
<script>
(()=> {
const holes=[[1,4,7],[2,4,13],[3,5,1],[4,3,15],[5,4,5],[6,4,11],[7,3,17],[8,4,3],[9,5,9],[10,4,8],[11,4,14],[12,3,18],[13,5,2],[14,4,10],[15,4,6],[16,3,16],[17,4,12],[18,5,4]];
window.currentHole=0;
let gs=[{name:"Player 1",hcp:18,s:Array(18).fill("")}];
const $=x=>document.getElementById(x);
$("date").value=new Date().toISOString().slice(0,10);
function shots(h,si){h=Math.max(0,Math.round(+h||0));return Math.floor(h/18)+(si<=h%18?1:0)}
function pts(par,g,h,si){let d=(+g-shots(h,si))-par;return d<=-3?5:d==-2?4:d==-1?3:d==0?2:d==1?1:0}
function totals(g){let p=0,n=0;g.s.forEach((v,i)=>{if(+v){p+=pts(holes[i][1],v,g.hcp,holes[i][2]);n++}});return[p,n]}
function renderPlayers(){$("players").innerHTML=gs.map((g,i)=>`<div class="pr"><input value="${g.name}" data-n="${i}"><input type="number" value="${g.hcp}" data-h="${i}"><button class="btn grey" data-r="${i}">×</button></div>`).join("");
document.querySelectorAll("[data-n]").forEach(x=>x.oninput=()=>{gs[x.dataset.n].name=x.value;renderScore()});document.querySelectorAll("[data-h]").forEach(x=>x.oninput=()=>{gs[x.dataset.h].hcp=x.value;renderScore()});document.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{if(gs.length>1){gs.splice(x.dataset.r,1);renderAll()}})}
function renderScore(){
  let hole=Math.min(17,Math.max(0,window.currentHole||0)), h=holes[hole];
  let cards=gs.map((g,j)=>{let v=g.s[hole]||"",p=v?pts(h[1],v,g.hcp,h[2]):"";return `<div class="playerScore"><div><b>${g.name}</b><span class="muted">Hcp ${g.hcp}</span></div><input class="bigScore" type="number" min="1" max="15" inputmode="numeric" value="${v}" placeholder="-" data-s="${j}-${hole}"><div class="bigPts">${p||"—"}<span>pts</span></div></div>`}).join("");
  let prev=hole?`<button class="navBtn" id="prevHole">← Previous</button>`:"<span></span>", next=hole<17?`<button class="navBtn green" id="nextHole">Next hole →</button>`:`<button class="navBtn green" id="finishHole">Finish round</button>`;
  $("score").innerHTML=`<div class="holeNav"><button class="navBtn grey" id="holeMinus">−</button><div><div class="holeTitle">HOLE ${h[0]}</div><div class="holeInfo">Par ${h[1]} · Stroke Index ${h[2]}</div></div><button class="navBtn grey" id="holePlus">+</button></div><div class="mobileCards">${cards}</div><div class="navRow">${prev}${next}</div><div class="holeStrip">${holes.map((x,i)=>`<button class="${i===hole?'sel':''} ${gs.some(g=>g.s[i])?'done':''}" data-hole="${i}">${x[0]}</button>`).join("")}</div>`;
  document.querySelectorAll("[data-s]").forEach(x=>x.oninput=()=>{let [j,i]=x.dataset.s.split("-");gs[j].s[i]=x.value;update()});
  $("prevHole")?.addEventListener("click",()=>{window.currentHole=hole-1;renderScore()});
  $("nextHole")?.addEventListener("click",()=>{window.currentHole=hole+1;renderScore()});
  $("finishHole")?.addEventListener("click",()=>{window.currentHole=0;update();window.scrollTo({top:0,behavior:"smooth"})});
  $("holeMinus")?.addEventListener("click",()=>{window.currentHole=Math.max(0,hole-1);renderScore()});
  $("holePlus")?.addEventListener("click",()=>{window.currentHole=Math.min(17,hole+1);renderScore()});
  document.querySelectorAll("[data-hole]").forEach(x=>x.onclick=()=>{window.currentHole=+x.dataset.hole;renderScore()});
}
function update(){renderScore();let a=gs.map((g,i)=>({i,p:totals(g)[0],n:totals(g)[1],name:g.name})).sort((a,b)=>b.p-a.p);$("leader").innerHTML=a.map((x,i)=>`<div class="lr"><b>${i+1}</b><b>${x.name}<br><span class="muted">${x.n}/18 holes</span></b><span>${x.p} pts</span><span class="big">${x.p}</span></div>`).join("")}
function renderAll(){renderPlayers();renderScore();renderLeader();update()}
function renderLeader(){ }
$("add").onclick=()=>{if(gs.length<4){gs.push({name:"Player "+(gs.length+1),hcp:18,s:Array(18).fill("")});renderAll()}};
$("clear").onclick=()=>{gs.forEach(g=>g.s=Array(18).fill(""));update()};
$("new").onclick=()=>{if(confirm("Start a new round?")){gs=[{name:"Player 1",hcp:18,s:Array(18).fill("")}];$("course").value="";renderAll()}};
$("save").onclick=()=>{let h=JSON.parse(localStorage.getItem("sfh")||"[]");h.unshift({course:$("course").value||"Course",date:$("date").value,players:gs.map(g=>({name:g.name,points:totals(g)[0]}))});localStorage.setItem("sfh",JSON.stringify(h.slice(0,30)));showSaved();alert("Round saved")};
function showSaved(){let h=JSON.parse(localStorage.getItem("sfh")||"[]");$("saved").innerHTML=h.length?"<b>Saved rounds</b>"+h.map(x=>`<div class="muted" style="padding:8px 0;border-bottom:1px solid #ddd"><b>${x.course}</b> · ${x.date}<br>${x.players.map(p=>p.name+" "+p.points+" pts").join(" • ")}</div>`).join(""):"<span class='muted'>No saved rounds</span>"}
renderAll();showSaved();
})();
</script></body></html>
